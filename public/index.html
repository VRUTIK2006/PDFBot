<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDFBot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060d; --ink:#e9ecff; --dim:#8b92b8; --cyan:#5ef2ff; --violet:#8b5cff; --pink:#ff4fa3;
  --glass:rgba(12,14,30,.78); --line:rgba(150,160,255,.2);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden}
button{font-family:inherit}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 35%,transparent 40%,rgba(5,6,13,.8) 100%)}
.hidden{display:none!important}

/* ---------- header ---------- */
header{position:fixed;top:0;left:0;right:0;height:60px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;flex:none}
.logo i{width:22px;height:22px;border-radius:50%;background:conic-gradient(from 0deg,var(--cyan),var(--violet),var(--pink),var(--cyan));box-shadow:0 0 18px rgba(139,92,255,.7);animation:spin 6s linear infinite}
.logo span{background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
.right{display:flex;gap:8px;align-items:center;min-width:0}
.chip,.btn-ghost{font-family:'JetBrains Mono',monospace;font-size:12px;padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.chip{display:flex;gap:6px;min-width:0}
.chip b{color:var(--cyan);font-weight:500;overflow:hidden;text-overflow:ellipsis;max-width:26vw}
.btn-ghost{cursor:pointer;transition:.2s;display:flex;align-items:center;gap:6px}
.btn-ghost:hover{color:var(--ink);border-color:var(--violet)}

/* ---------- bottom stack (stage / answer / suggestions / dock) ---------- */
#stack{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(780px,calc(100% - 24px));z-index:6;display:flex;flex-direction:column;gap:12px;pointer-events:none}
#stack>*{pointer-events:auto}

#stage{text-align:center;padding:0 4px 6px}
#stage h1{font-size:clamp(26px,5vw,44px);font-weight:700;line-height:1.1;letter-spacing:-1px}
#stage h1 em{font-style:normal;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
#stage p{margin-top:10px;color:var(--dim);font-size:15px}
.cta{margin-top:18px;display:inline-flex;gap:10px;align-items:center;padding:13px 26px;border-radius:999px;border:none;cursor:pointer;font:600 15px 'Space Grotesk';color:#07081a;background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 30px rgba(94,242,255,.3);transition:.25s}
.cta:hover{transform:translateY(-2px);box-shadow:0 0 44px rgba(139,92,255,.6)}
#progress{margin:18px auto 0;width:min(340px,80%);height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
#progress div{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:width .3s}
#stageLabel{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--cyan);margin-top:12px;min-height:18px}

/* answer card: solid-ish panel, sits ABOVE the dock, never over the orb */
.card{display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--line);border-radius:20px;max-height:min(46dvh,480px);box-shadow:0 20px 60px rgba(0,0,0,.55);animation:rise .4s cubic-bezier(.2,.9,.3,1);overflow:hidden}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.chead{display:flex;align-items:flex-start;gap:12px;padding:14px 14px 10px 20px;border-bottom:1px solid var(--line);flex:none}
.q{flex:1;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--cyan);line-height:1.5;word-break:break-word}
.x{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--dim);cursor:pointer;display:grid;place-items:center;transition:.2s}
.x:hover{color:#fff;border-color:var(--pink);background:rgba(255,79,163,.12)}
.x svg{width:14px;height:14px}
.cbody{padding:16px 20px 18px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(139,92,255,.5) transparent;flex:1;min-height:0}
.cbody::-webkit-scrollbar{width:6px}.cbody::-webkit-scrollbar-thumb{background:rgba(139,92,255,.45);border-radius:6px}
.a{font-size:15.5px;line-height:1.65;word-break:break-word}
.a code{font-family:'JetBrains Mono',monospace;background:rgba(255,255,255,.08);padding:1px 6px;border-radius:5px;font-size:13px}
.a b{color:#fff}
.caret::after{content:"";display:inline-block;width:8px;height:15px;background:var(--cyan);margin-left:3px;vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.think{display:flex;gap:6px;align-items:center;color:var(--dim);font-size:14px}
.think span{width:7px;height:7px;border-radius:50%;background:var(--violet);animation:bounce 1.1s infinite}
.think span:nth-child(2){animation-delay:.15s;background:var(--cyan)}
.think span:nth-child(3){animation-delay:.3s;background:var(--pink)}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-6px);opacity:1}}
.srcs{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.src{font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--dim);cursor:pointer;transition:.2s}
.src:hover,.src.on{color:var(--ink);border-color:var(--pink);background:rgba(255,79,163,.1)}
.src b{color:var(--pink);font-weight:500}
.shard{margin-top:10px;padding:12px 14px;border-left:2px solid var(--pink);background:rgba(255,255,255,.03);border-radius:0 10px 10px 0;font-size:13px;line-height:1.55;color:var(--dim);white-space:pre-wrap;word-break:break-word;max-height:140px;overflow:auto}

#suggest{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#suggest button{font:500 13px 'Space Grotesk';padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer;transition:.2s;animation:rise .5s backwards}
#suggest button:hover{border-color:var(--cyan);transform:translateY(-2px)}

/* dock */
#dock{display:flex;align-items:center;gap:8px;height:62px;padding:8px;border-radius:999px;background:var(--glass);border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.5);transition:border-color .3s,box-shadow .3s}
#dock:focus-within{border-color:rgba(94,242,255,.55);box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 30px rgba(94,242,255,.15)}
#dock input{flex:1;min-width:0;height:100%;background:none;border:none;outline:none;color:var(--ink);font:400 16px 'Space Grotesk';padding:0 8px}
#dock input::placeholder{color:#5d6490}
.round{width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;display:grid;place-items:center;transition:.2s;flex:none;padding:0}
.round svg{width:20px;height:20px;display:block}
#attach{background:rgba(255,255,255,.06);color:var(--dim)}
#attach:hover{color:var(--cyan);background:rgba(94,242,255,.1)}
#send{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#07081a}
#send:hover:not(:disabled){transform:scale(1.06);box-shadow:0 0 22px rgba(94,242,255,.5)}
#send:disabled,#dock input:disabled{opacity:.4;cursor:not-allowed}

/* ---------- history drawer ---------- */
#scrim{position:fixed;inset:0;z-index:19;background:rgba(3,4,10,.55);opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:20;background:rgba(8,9,22,.96);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;visibility:hidden}
#drawer.open{transform:none;visibility:visible}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);flex:none}
.dhead h3{font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--dim);font-weight:400;letter-spacing:1.2px}
#histList{padding:16px 18px calc(18px + env(safe-area-inset-bottom));overflow-y:auto;flex:1;overscroll-behavior:contain}
.h-item{display:block;width:100%;text-align:left;margin-bottom:12px;padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:14px;line-height:1.5;color:inherit;cursor:pointer;transition:.2s}
.h-item:hover{border-color:var(--cyan);background:rgba(94,242,255,.05)}
.h-item .hq{color:var(--cyan);font-family:'JetBrains Mono',monospace;font-size:12px;margin-bottom:6px}
.h-item .ha{color:var(--dim);display:-webkit-box;-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--dim);font-size:14px;text-align:center;margin-top:40px}

/* drop overlay + toast */
#drop{position:fixed;inset:14px;z-index:30;border:2px dashed var(--cyan);border-radius:28px;background:rgba(94,242,255,.07);display:grid;place-items:center;font-size:clamp(20px,4vw,28px);font-weight:600;color:var(--cyan);opacity:0;pointer-events:none;transition:.2s}
#drop.on{opacity:1}
#toast{position:fixed;top:70px;left:50%;transform:translate(-50%,-16px);z-index:40;padding:12px 18px;border-radius:14px;background:rgba(40,10,28,.95);border:1px solid var(--pink);color:#ffd5e8;font-size:14px;opacity:0;pointer-events:none;transition:.3s;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:640px){
  .logo{font-size:18px}
  .chip{font-size:11px;padding:7px 11px}.chip .sep,.chip .cc{display:none}
  .chip b{max-width:34vw}
  #stage p{font-size:14px}
  .cta{padding:12px 22px}
  .card{border-radius:18px;max-height:min(44dvh,420px)}
  .cbody{padding:14px 16px 16px}.chead{padding:12px 12px 8px 16px}
  .a{font-size:15px}
  #dock{height:58px}.round{width:42px;height:42px}
  #dock input{font-size:16px}
}
@media(max-height:560px){#stage p{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette"></div>

<header>
  <div class="logo"><i></i><span>PDFBot</span></div>
  <div class="right">
    <div class="chip hidden" id="fileChip"><b id="fileName">file.pdf</b><span class="sep">·</span><span class="cc"><span id="chunkCount">0</span> shards</span></div>
    <button class="btn-ghost hidden" id="histBtn" aria-expanded="false">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5M12 7v5l3 2"/></svg>history
    </button>
  </div>
</header>

<div id="stack">
  <section id="stage">
    <h1 id="stageTitle">Feed the <em>orb</em> a PDF</h1>
    <p id="stageSub">Drop a document anywhere. It becomes a constellation of memory you can talk to.</p>
    <button class="cta" id="pick">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L7 9m5-5 5 5M4 20h16"/></svg>
      Choose PDF
    </button>
    <div id="progress" class="hidden"><div></div></div>
    <div id="stageLabel"></div>
  </section>

  <div id="answerWrap"></div>
  <div id="suggest" class="hidden"></div>

  <form id="dock" autocomplete="off">
    <button type="button" class="round" id="attach" title="Replace PDF" aria-label="Replace PDF">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 11-9.2 9.2a5.5 5.5 0 0 1-7.8-7.8l9.2-9.2a3.7 3.7 0 0 1 5.2 5.2l-9.2 9.2a1.8 1.8 0 0 1-2.6-2.6L15 6.8"/></svg>
    </button>
    <input id="q" type="text" placeholder="Upload a PDF to wake the orb…" disabled enterkeyhint="send">
    <button type="submit" class="round" id="send" disabled title="Ask" aria-label="Ask">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m0 0-6-6m6 6-6 6"/></svg>
    </button>
  </form>
</div>

<div id="scrim"></div>
<aside id="drawer" aria-hidden="true">
  <div class="dhead">
    <h3>CONVERSATION LOG</h3>
    <button class="x" id="histClose" aria-label="Close history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div id="histList"></div>
</aside>
<div id="drop">Release to feed the orb</div>
<div id="toast"></div>
<input type="file" id="file" accept="application/pdf" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const API = "http://localhost:5000";
const $ = s => document.querySelector(s);
const MOBILE = innerWidth < 700 || matchMedia('(pointer:coarse)').matches;

/* ================= 3D SCENE ================= */
const canvas = $('#scene');
const PR = Math.min(devicePixelRatio || 1, MOBILE ? 1.5 : 2);
const renderer = new THREE.WebGLRenderer({canvas, antialias: PR < 2, alpha:true, powerPreference:'high-performance'});
renderer.setPixelRatio(PR);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, .1, 200);
camera.position.set(0, 0, 10.5);
const world = new THREE.Group(); scene.add(world);

function fib(n, r){
  const pts=[], g=Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<n;i++){ const y=1-(i/(n-1||1))*2, rad=Math.sqrt(1-y*y), th=g*i;
    pts.push(new THREE.Vector3(Math.cos(th)*rad*r, y*r, Math.sin(th)*rad*r)); }
  return pts;
}

/* orb */
const ORB_N = MOBILE ? 2200 : 3800;
const orbGeo = new THREE.BufferGeometry();
const orbPos = new Float32Array(ORB_N*3), orbRand = new Float32Array(ORB_N);
fib(ORB_N, 2).forEach((p,i)=>{ orbPos.set([p.x,p.y,p.z], i*3); orbRand[i]=Math.random(); });
orbGeo.setAttribute('position', new THREE.BufferAttribute(orbPos,3));
orbGeo.setAttribute('aRand', new THREE.BufferAttribute(orbRand,1));
const orbMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{uTime:{value:0},uEnergy:{value:0},uPR:{value:PR},uC1:{value:new THREE.Color(0x5ef2ff)},uC2:{value:new THREE.Color(0xff4fa3)}},
  vertexShader:`
    uniform float uTime,uEnergy,uPR; attribute float aRand; varying float vMix;
    void main(){
      vec3 p=position; vec3 n=normalize(p);
      float w=sin(p.x*2.0+uTime*.8)+sin(p.y*2.3+uTime*.6)+sin(p.z*1.9+uTime*.7);
      float d=w*.07*(1.0+uEnergy*2.6)+sin(uTime*2.2+aRand*6.28)*.03*uEnergy;
      p+=n*d;
      vec4 mv=modelViewMatrix*vec4(p,1.0);
      gl_PointSize=(1.4+aRand*1.6+uEnergy*1.1)*(20.0/-mv.z)*uPR;
      vMix=.5+.5*sin(uTime*.9+aRand*9.0+p.y);
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader:`
    uniform vec3 uC1,uC2; varying float vMix;
    void main(){ float d=length(gl_PointCoord-.5); if(d>.5)discard;
      float a=pow(1.0-d*2.0,1.6); gl_FragColor=vec4(mix(uC1,uC2,vMix),a*.95); }`
});
world.add(new THREE.Points(orbGeo, orbMat));

const core = new THREE.Mesh(new THREE.SphereGeometry(1.35,24,24),
  new THREE.MeshBasicMaterial({color:0x4a2cff,transparent:true,opacity:.22,blending:THREE.AdditiveBlending,depthWrite:false}));
world.add(core);

const rings=[];
[[2.9,.4,0],[3.3,-.9,.6],[3.7,1.2,-.4]].forEach(([r,rx,rz],i)=>{
  const pts=[]; for(let k=0;k<=96;k++){const a=k/96*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r));}
  const ring=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:[0x5ef2ff,0x8b5cff,0xff4fa3][i],transparent:true,opacity:.28,blending:THREE.AdditiveBlending}));
  ring.rotation.set(rx,0,rz); ring.userData.sp=(.12+i*.07)*(i%2?-1:1); world.add(ring); rings.push(ring);
});

const scanPts=[]; for(let k=0;k<=72;k++){const a=k/72*Math.PI*2; scanPts.push(new THREE.Vector3(Math.cos(a),0,Math.sin(a)));}
const scan=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(scanPts),
  new THREE.LineBasicMaterial({color:0x5ef2ff,transparent:true,opacity:.9,blending:THREE.AdditiveBlending}));
scan.visible=false; world.add(scan);

const dustN=MOBILE?500:1100, dp=new Float32Array(dustN*3);
for(let i=0;i<dustN;i++){const r=14+Math.random()*40,t=Math.random()*6.283,u=Math.acos(2*Math.random()-1);
  dp.set([r*Math.sin(u)*Math.cos(t),r*Math.cos(u),r*Math.sin(u)*Math.sin(t)],i*3);}
const dustGeo=new THREE.BufferGeometry(); dustGeo.setAttribute('position',new THREE.BufferAttribute(dp,3));
const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({size:.07,color:0x9aa6ff,transparent:true,opacity:.5,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(dust);

/* chunk constellation */
let nodes=null, nodeAct=null, nodePos=[], nodeCount=0, spawnStart=0;
const nodesGroup=new THREE.Group(); nodesGroup.scale.setScalar(0); world.add(nodesGroup);

function buildNodes(n){
  while(nodesGroup.children.length){const o=nodesGroup.children.pop(); o.geometry.dispose();}
  nodeCount=Math.max(1,Math.min(n,200));
  const base=fib(Math.max(nodeCount,2),5.0);
  nodePos=base.slice(0,nodeCount).map(p=>p.add(new THREE.Vector3((Math.random()-.5)*1.3,(Math.random()-.5)*1.3,(Math.random()-.5)*1.3)));
  const pos=new Float32Array(nodeCount*3), seed=new Float32Array(nodeCount);
  nodeAct=new Float32Array(nodeCount);
  nodePos.forEach((p,i)=>{pos.set([p.x,p.y,p.z],i*3); seed[i]=Math.random();});
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));
  g.setAttribute('aAct',new THREE.BufferAttribute(nodeAct,1));
  const m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{uPR:{value:PR}},
    vertexShader:`attribute float aSeed,aAct; uniform float uPR; varying float vA;
      void main(){ vec4 mv=modelViewMatrix*vec4(position,1.0);
        gl_PointSize=(34.0/-mv.z)*(1.0+aSeed*.9)*(1.0+aAct*3.2)*uPR; vA=aAct; gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`varying float vA; void main(){ float d=length(gl_PointCoord-.5); if(d>.5)discard;
      float a=pow(1.0-d*2.0,2.0); vec3 c=mix(vec3(.45,.6,1.0),vec3(1.0,.35,.65),vA);
      gl_FragColor=vec4(c,a*(.6+.4*vA)); }`});
  nodes=new THREE.Points(g,m); nodesGroup.add(nodes);
  const seg=[];
  nodePos.forEach((p,i)=>{
    nodePos.map((q,j)=>[j,p.distanceToSquared(q)]).filter(x=>x[0]!==i).sort((a,b)=>a[1]-b[1]).slice(0,2)
      .forEach(([j])=>seg.push(p.x,p.y,p.z,nodePos[j].x,nodePos[j].y,nodePos[j].z));
  });
  const lg=new THREE.BufferGeometry(); lg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(seg),3));
  nodesGroup.add(new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0x6a78ff,transparent:true,opacity:.13,blending:THREE.AdditiveBlending})));
  nodesGroup.scale.setScalar(0); spawnStart=performance.now();
}

/* retrieval beams */
const beams=[];
const beamLineMat=()=>new THREE.LineBasicMaterial({color:0xff4fa3,transparent:true,opacity:0,blending:THREE.AdditiveBlending});
function fireBeam(idx,delay){
  const target=nodePos[idx]; if(!target) return;
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),target.clone()]),beamLineMat());
  const dg=new THREE.BufferGeometry(); dg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(3),3));
  const dot=new THREE.Points(dg,new THREE.PointsMaterial({size:.45,color:0xffffff,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  world.add(line,dot); beams.push({line,dot,target,idx,born:performance.now(),delay,fired:false});
}

/* ---- layout-aware orb placement: orb lives in the free area above the bottom stack ---- */
let region={top:60,bottom:innerHeight*.6};
function measure(){
  const st=$('#stack').getBoundingClientRect();
  region.top=60; region.bottom=Math.max(region.top+120, st.top-8);
}
new ResizeObserver(measure).observe($('#stack'));

let state='empty', energy=0, dragging=false, mx=0, my=0, worldY=0, worldS=1, frame=0;
function setState(s){ state=s; }
if(!MOBILE) addEventListener('pointermove',e=>{mx=e.clientX/innerWidth*2-1; my=e.clientY/innerHeight*2-1;});
function resize(){
  const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix(); camera.position.z = w<700?13:10.5; measure();
}
addEventListener('resize',resize); resize();

const clock=new THREE.Clock(); const ease=t=>1-Math.pow(1-t,3);
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime, now=performance.now();
  if(++frame%10===0) measure();

  const tgt = dragging?.9 : {empty:.15,ingesting:1,thinking:.8,ready:.28}[state];
  energy += (tgt-energy)*Math.min(1,dt*3);
  orbMat.uniforms.uTime.value=t; orbMat.uniforms.uEnergy.value=energy;
  core.material.opacity=.16+energy*.18+Math.sin(t*2)*.03; core.scale.setScalar(1+Math.sin(t*1.5)*.04+energy*.12);

  // fit the orb into the free region
  const W=innerWidth,H=innerHeight, visH=2*Math.tan(camera.fov*Math.PI/360)*camera.position.z, pxU=H/visH;
  const sizeU = nodes ? 10.6 : 7.6;
  const regH=region.bottom-region.top;
  const ts=Math.max(.22,Math.min(1.1,(regH*.96)/(sizeU*pxU),(W*.96)/(sizeU*pxU)));
  const cy=(region.top+region.bottom)/2, ty=(1-2*cy/H)*visH/2;
  const k=Math.min(1,dt*3.2); worldY+=(ty-worldY)*k; worldS+=(ts-worldS)*k;
  world.position.y=worldY; world.scale.setScalar(worldS);

  world.rotation.y+=dt*(.08+energy*.35); world.rotation.x=Math.sin(t*.2)*.1;
  rings.forEach(r=>r.rotation.y+=dt*r.userData.sp*(1+energy*3));
  dust.rotation.y+=dt*.01;
  camera.position.x+=(mx*1.2-camera.position.x)*.04; camera.position.y+=(-my*.8-camera.position.y)*.04; camera.lookAt(0,0,0);

  scan.visible = state==='ingesting';
  if(scan.visible){const y=Math.sin(t*2.2)*2, r=Math.sqrt(Math.max(.05,4-y*y))*1.08; scan.position.y=y; scan.scale.set(r,1,r);}

  if(nodes && spawnStart){const q=Math.min(1,(now-spawnStart)/1800); nodesGroup.scale.setScalar(ease(q)*(1+Math.sin(q*Math.PI)*.12)); if(q>=1)spawnStart=0;}
  if(nodes){let any=false; for(let i=0;i<nodeCount;i++){ if(nodeAct[i]>.002){nodeAct[i]*=Math.pow(.55,dt); any=true;} else if(nodeAct[i]) nodeAct[i]=0; }
    if(any) nodes.geometry.attributes.aAct.needsUpdate=true;}
  for(let i=beams.length-1;i>=0;i--){const b=beams[i], el=(now-b.born-b.delay)/1000;
    if(el<0) continue;
    if(!b.fired){b.fired=true; nodeAct[b.idx]=1; nodes.geometry.attributes.aAct.needsUpdate=true;}
    const p=Math.min(1,el/.9);
    b.dot.position.copy(b.target).multiplyScalar(ease(p)); b.dot.material.opacity=el<.9?1:Math.max(0,1-(el-.9)*3);
    b.line.material.opacity=(el<.9?el/.9:Math.max(0,1-(el-.9)/2.6))*.85;
    if(el<2.4) nodeAct[b.idx]=Math.max(nodeAct[b.idx],.9);
    if(el>3.6){world.remove(b.line,b.dot); b.line.geometry.dispose(); b.line.material.dispose(); b.dot.geometry.dispose(); b.dot.material.dispose(); beams.splice(i,1);}
  }
  renderer.render(scene,camera);
}
loop();

/* ================= APP LOGIC ================= */
const fileInput=$('#file'), qInput=$('#q'), sendBtn=$('#send'), wrap=$('#answerWrap'), suggestEl=$('#suggest'), stage=$('#stage');
const history=[]; let busy=false, typer=null;
const lock=v=>{qInput.disabled=sendBtn.disabled=v;};

function toast(msg){const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),4200);}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>esc(s).replace(/^\s*[*-]\s+/gm,'• ').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>');
function hashIdx(text){let h=2166136261; for(let i=0;i<text.length;i++){h^=text.charCodeAt(i); h=Math.imul(h,16777619);} return (h>>>0)%nodeCount;}
const X_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';

/* ---------- upload ---------- */
$('#pick').onclick=()=>fileInput.click();
$('#attach').onclick=()=>{ if(!busy) fileInput.click(); };
fileInput.onchange=()=>{ if(fileInput.files[0]) upload(fileInput.files[0]); fileInput.value=''; };

let dragDepth=0;
addEventListener('dragenter',e=>{e.preventDefault(); dragDepth++; dragging=true; $('#drop').classList.add('on');});
addEventListener('dragleave',e=>{e.preventDefault(); if(--dragDepth<=0){dragDepth=0; dragging=false; $('#drop').classList.remove('on');}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault(); dragDepth=0; dragging=false; $('#drop').classList.remove('on');
  const f=e.dataTransfer.files[0]; if(f) upload(f);});

const STAGES=['Reading pages…','Splitting into chunks…','Embedding with Gemini…','Building the vector index…'];
function upload(file){
  if(busy) return;
  if(file.type!=='application/pdf' && !/\.pdf$/i.test(file.name)) return toast('Only PDF files, please.');
  busy=true; setState('ingesting'); clearInterval(typer); wrap.innerHTML=''; suggestEl.classList.add('hidden'); lock(true);
  qInput.placeholder='The orb is digesting your document…';
  stage.classList.remove('hidden');
  $('#stageTitle').innerHTML='Digesting <em>'+esc(file.name.length>30?file.name.slice(0,27)+'…':file.name)+'</em>';
  $('#stageSub').textContent='Hang tight while the document turns into memory.';
  $('#pick').classList.add('hidden'); $('#progress').classList.remove('hidden');
  const bar=$('#progress div'), label=$('#stageLabel'); bar.style.width='4%'; label.textContent='Uploading 0%';
  let stageI=0, stageTimer=null;

  const fd=new FormData(); fd.append('file',file);
  const xhr=new XMLHttpRequest(); xhr.open('POST',API+'/upload');
  xhr.upload.onprogress=e=>{ if(e.lengthComputable){const p=e.loaded/e.total; bar.style.width=(4+p*30)+'%'; label.textContent='Uploading '+Math.round(p*100)+'%';}};
  xhr.upload.onload=()=>{
    label.textContent=STAGES[0]; bar.style.width='40%';
    stageTimer=setInterval(()=>{ stageI=Math.min(stageI+1,STAGES.length-1); label.textContent=STAGES[stageI];
      bar.style.width=Math.min(92,40+stageI*16+Math.random()*6)+'%'; },1800);
  };
  const fail=msg=>{clearInterval(stageTimer); busy=false; toast(msg); label.textContent='';
    $('#progress').classList.add('hidden');
    if(nodes){ setState('ready'); stage.classList.add('hidden'); lock(false); qInput.placeholder='Ask anything about your document…'; showSuggestions(); }
    else { setState('empty'); $('#stageTitle').innerHTML='Feed the <em>orb</em> a PDF'; $('#stageSub').textContent='Something went wrong. Try again.'; $('#pick').classList.remove('hidden'); qInput.placeholder='Upload a PDF to wake the orb…'; }};
  xhr.onerror=()=>fail('Cannot reach the server on '+API+'. Is it running?');
  xhr.onload=()=>{
    clearInterval(stageTimer);
    let data={}; try{data=JSON.parse(xhr.responseText);}catch{}
    if(xhr.status!==200) return fail(data.error||'Upload failed.');
    bar.style.width='100%'; label.textContent='Done ✓';
    buildNodes(data.totalChunksStored||1);
    $('#fileName').textContent=file.name; $('#chunkCount').textContent=data.totalChunksStored;
    $('#fileChip').classList.remove('hidden');
    setTimeout(()=>{
      busy=false; setState('ready'); stage.classList.add('hidden');
      lock(false); qInput.placeholder='Ask anything about your document…'; if(!MOBILE) qInput.focus();
      showSuggestions();
    },900);
  };
  xhr.send(fd);
}

function showSuggestions(){
  const items=['Summarize this document','What are the key points?','List important terms','What conclusions does it draw?'];
  suggestEl.innerHTML=''; items.forEach((s,i)=>{const b=document.createElement('button'); b.textContent=s; b.style.animationDelay=i*70+'ms';
    b.onclick=()=>ask(s); suggestEl.appendChild(b);});
  suggestEl.classList.remove('hidden');
}

/* ---------- ask ---------- */
$('#dock').onsubmit=e=>{e.preventDefault(); const v=qInput.value.trim(); if(v) ask(v);};

function cardShell(question){
  const card=document.createElement('div'); card.className='card';
  card.innerHTML=`<div class="chead"><div class="q"></div><button class="x" title="Minimize" aria-label="Minimize answer">${X_ICON}</button></div><div class="cbody"></div>`;
  card.querySelector('.q').textContent='› '+question;
  card.querySelector('.x').onclick=()=>{ clearInterval(typer); wrap.innerHTML=''; if(!busy){ setState('ready'); lock(false);} showSuggestions(); };
  wrap.innerHTML=''; wrap.appendChild(card);
  return card;
}

async function ask(question){
  if(busy||!nodes) return;
  busy=true; qInput.value=''; suggestEl.classList.add('hidden'); clearInterval(typer); lock(true); setState('thinking');
  const card=cardShell(question);
  card.querySelector('.cbody').innerHTML='<div class="think"><span></span><span></span><span></span>&nbsp;Searching the constellation…</div>';
  try{
    const r=await fetch(API+'/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||'Request failed');
    const ctx=data.contextUsed||[];
    ctx.forEach((c,i)=>{ c._idx=(typeof c.index==='number'?c.index:hashIdx(c.text))%nodeCount; fireBeam(c._idx,i*260); });
    setTimeout(()=>render(question,data.answer||'',ctx), 800);
  }catch(err){
    busy=false; setState('ready'); lock(false); wrap.innerHTML=''; showSuggestions();
    toast(err.message==='Failed to fetch'?'Cannot reach the server on '+API:err.message);
  }
}

function render(question,answer,ctx){
  history.push({q:question,a:answer,ctx}); updateHistory();
  const card=wrap.querySelector('.card'); if(!card) { busy=false; setState('ready'); lock(false); return; }
  const body=card.querySelector('.cbody'); body.innerHTML='<div class="a caret"></div>';
  const a=body.firstChild; let i=0, stick=true; const step=Math.max(2,Math.ceil(answer.length/200));
  body.onscroll=()=>{ stick = body.scrollHeight-body.scrollTop-body.clientHeight<40; };
  typer=setInterval(()=>{
    i=Math.min(answer.length,i+step); a.innerHTML=fmt(answer.slice(0,i)); if(stick) body.scrollTop=body.scrollHeight;
    if(i>=answer.length){clearInterval(typer); a.classList.remove('caret'); addSources(body,ctx);
      busy=false; setState('ready'); lock(false); if(!MOBILE) qInput.focus();}
  },16);
}

function addSources(body,ctx){
  if(!ctx.length) return;
  const box=document.createElement('div'); box.className='srcs';
  const shard=document.createElement('div'); shard.className='shard hidden';
  ctx.forEach(c=>{
    const b=document.createElement('button'); b.type='button'; b.className='src';
    b.innerHTML=`shard #${String((c._idx||0)+1).padStart(2,'0')} · <b>${Math.round((c.score||0)*100)}%</b>`;
    b.onclick=()=>{ const on=b.classList.contains('on'); box.querySelectorAll('.src').forEach(x=>x.classList.remove('on'));
      if(on){shard.classList.add('hidden');return;} b.classList.add('on'); shard.textContent=c.text; shard.classList.remove('hidden');
      fireBeam(c._idx,0); setTimeout(()=>{body.scrollTop=body.scrollHeight;},30); };
    box.appendChild(b);
  });
  body.appendChild(box); body.appendChild(shard);
}

/* ---------- history drawer ---------- */
const drawer=$('#drawer'), scrim=$('#scrim');
function openDrawer(v){
  drawer.classList.toggle('open',v); scrim.classList.toggle('on',v);
  drawer.setAttribute('aria-hidden',!v); $('#histBtn').setAttribute('aria-expanded',v);
}
function updateHistory(){
  $('#histBtn').classList.remove('hidden');
  const list=$('#histList'); list.innerHTML='';
  if(!history.length){list.innerHTML='<div class="empty">No questions yet.</div>'; return;}
  history.slice().reverse().forEach(h=>{
    const b=document.createElement('button'); b.className='h-item';
    b.innerHTML=`<div class="hq"></div><div class="ha"></div>`;
    b.querySelector('.hq').textContent='› '+h.q; b.querySelector('.ha').innerHTML=fmt(h.a);
    b.onclick=()=>{ if(busy) return openDrawer(false); openDrawer(false); clearInterval(typer);
      const card=cardShell(h.q); const body=card.querySelector('.cbody');
      body.innerHTML='<div class="a"></div>'; body.firstChild.innerHTML=fmt(h.a); addSources(body,h.ctx||[]);
      suggestEl.classList.add('hidden'); };
    list.appendChild(b);
  });
}
$('#histBtn').onclick=()=>openDrawer(!drawer.classList.contains('open'));
$('#histClose').onclick=()=>openDrawer(false);
scrim.onclick=()=>openDrawer(false);
addEventListener('keydown',e=>{ if(e.key==='Escape') openDrawer(false); });
</script>
</body>
</html>
